# =====================================================================
#  Citazioni della home (riquadro con i pixel che si ricompongono)
#  La pagina ne sceglie una a caso e la cambia ogni 8 secondi.
#
#  Per AGGIUNGERE una citazione copia un blocco qui sotto e cambia il testo:
#    - testo:  la citazione (obbligatorio), sempre tra virgolette doppie "…"
#      autore: chi l'ha detta (obbligatorio), tra virgolette doppie
#      en:     traduzione per la home inglese (facoltativo: se manca,
#              anche la home inglese mostra il testo italiano)
#
#  Regole:
#  - il trattino "-" sta all'inizio della riga, "autore" ed "en" sono
#    rientrati di due spazi (allineati sotto "testo");
#  - gli apostrofi vanno bene ("s'impara"); se dentro al testo servono
#    delle virgolette, usa « » e non " ;
#  - testo al massimo ~150 caratteri, autore al massimo ~35;
#  - solo lettere latine (anche accentate): il carattere pixel non ha
#    l'alfabeto greco, per questo il proverbio greco è in italiano;
#  - per NASCONDERE una citazione senza cancellarla metti # davanti
#    alle sue righe.
# =====================================================================

- testo: "L'educazione è cosa di cuore."
  autore: "Don Bosco"
  en: "Education is a matter of the heart."

# Lettera da Roma, 10 maggio 1884
- testo: "Il maestro visto solo in cattedra è maestro e non più, ma se va in ricreazione coi giovani diventa come fratello."
  autore: "Don Bosco"
  en: "A teacher seen only at the desk is a teacher and nothing more; but if he joins the young at recreation, he becomes like a brother."

# Lettera da Roma, 10 maggio 1884
- testo: "Chi sa di essere amato, ama."
  autore: "Don Bosco"
  en: "Whoever knows they are loved, loves."

# «Χαλεπὰ τὰ καλά». Platone lo riporta come proverbio (Ippia maggiore,
# Repubblica, Cratilo); la tradizione antica lo attribuisce a Solone.
- testo: "Le cose belle sono difficili."
  autore: "Proverbio greco, citato da Platone"
  en: "Beautiful things are difficult."

# Plutarco, «L'arte di ascoltare» (resa libera del passo)
- testo: "La mente non è un vaso da riempire, ma un fuoco da accendere."
  autore: "da Plutarco"
  en: "The mind is not a vessel to be filled, but a fire to be kindled."

# «Lettera a una professoressa», 1967 (scuola di don Lorenzo Milani)
- testo: "La scuola ha un problema solo: i ragazzi che perde."
  autore: "Scuola di Barbiana"
  en: "School has only one problem: the children it loses."

# Seneca, «Lettere a Lucilio», 7: «Homines dum docent discunt»
- testo: "Gli uomini, mentre insegnano, imparano."
  autore: "Seneca"
  en: "People learn while they teach."

- testo: "Tristo è quel discepolo che non avanza il suo maestro."
  autore: "Leonardo da Vinci"
  en: "Poor is the pupil who does not surpass his master."

# Confucio, «Dialoghi» (Lunyu), II, 15
- testo: "Imparare senza riflettere è fatica perduta; riflettere senza imparare è pericoloso."
  autore: "Confucio"
  en: "Learning without thought is labour lost; thought without learning is perilous."

# Dante, «Paradiso», V, 41-42
- testo: "Non fa scienza, sanza lo ritenere, avere inteso."
  autore: "Dante Alighieri"
  en: "Understanding without remembering does not make knowledge."

# Gianni Rodari, «Grammatica della fantasia», 1973
- testo: "Tutti gli usi della parola a tutti: non perché tutti siano artisti, ma perché nessuno sia schiavo."
  autore: "Gianni Rodari"
  en: "Every use of words for everyone: not so that all may be artists, but so that no one may be a slave."

# Seneca, «Ercole furioso»: «non est ad astra mollis e terris via»
- testo: "Non c'è via facile dalla terra alle stelle."
  autore: "Seneca"
  en: "There is no easy way from the earth to the stars."

# Riportata da Diogene Laerzio, «Vite dei filosofi», V
- testo: "Le radici dell'educazione sono amare, ma i frutti sono dolci."
  autore: "Aristotele"
  en: "The roots of education are bitter, but the fruit is sweet."

# Motto attribuito dalla tradizione, non documentato con certezza
- testo: "Ancora imparo."
  autore: "Michelangelo (attribuito)"
  en: "I am still learning."

- testo: "L'ignoranza genera fiducia più spesso della conoscenza."
  autore: "Charles Darwin"
  en: "Ignorance more frequently begets confidence than does knowledge."

- testo: "Quando una metrica si trasforma in un obiettivo, smette di essere una buona metrica."
  autore: "Charles Goodhart"
  en: "When a measure becomes a target, it ceases to be a good measure."

- testo: "Se non riesci a spiegarlo in modo semplice, non l’hai capito abbastanza bene."
  autore: "Richard Feynman"
  en: "If you can't explain it simply, you don't understand it well enough."

# Aristotele, Metafisica, I, 1, 980a21
- testo: "Tutti gli uomini desiderano per natura sapere."
  autore: "Aristotele"
  en: "All men by nature desire to know."

# Platone, Apologia di Socrate, 38a
- testo: "Una vita senza esame non è degna di essere vissuta."
  autore: "Socrate, riportato da Platone"
  en: "The unexamined life is not worth living."

# Orazio, Epistole, I, 2, 40-41
# «Dimidium facti qui coepit habet; sapere aude, incipe»
- testo: "Chi ha cominciato ha già fatto metà dell'opera: osa essere saggio, comincia."
  autore: "Orazio"
  en: "He who has begun is half done: dare to be wise, begin."

# Immanuel Kant, Risposta alla domanda: che cos'è l'Illuminismo?, 1784
# «Habe Mut, dich deines eigenen Verstandes zu bedienen!»
- testo: "Abbi il coraggio di servirti della tua propria intelligenza."
  autore: "Immanuel Kant"
  en: "Have courage to use your own understanding."

# Michel de Montaigne, Saggi, I, 26, Dell'educazione dei fanciulli
- testo: "È meglio avere una testa ben fatta che una testa ben piena."
  autore: "Michel de Montaigne"
  en: "Better a well-formed mind than a well-filled one."

# Michel de Montaigne, Saggi, I, 26
# «Savoir par coeur n'est pas savoir»
- testo: "Sapere a memoria non è sapere."
  autore: "Michel de Montaigne"
  en: "Knowing by heart is not truly knowing."

  # John Dewey, My Pedagogic Creed, 1897
- testo: "L'educazione è un processo di vita, non una preparazione alla vita futura."
  autore: "John Dewey"
  en: "Education is a process of living and not a preparation for future living."

# Paulo Freire, Pedagogia dell'autonomia, 1996
- testo: "Insegnare non è trasferire conoscenza, ma creare le possibilità per produrla o costruirla."
  autore: "Paulo Freire"
  en: "Teaching is not transferring knowledge, but creating the possibilities for its production or construction."

# Paulo Freire, Pedagogia degli oppressi, 1970
- testo: "Nessuno educa nessuno, nessuno educa sé stesso: gli uomini si educano insieme, mediati dal mondo."
  autore: "Paulo Freire"
  en: "No one educates anyone else, nor does anyone educate themselves alone: people educate one another, mediated by the world."

# Don Giovanni Bosco, Lettera da Roma, 10 maggio 1884
- testo: "Che i giovani non solo siano amati, ma che essi stessi conoscano di essere amati."
  autore: "Don Giovanni Bosco"
  en: "Young people must not only be loved, but must know that they are loved."

# Scuola di Barbiana, Lettera a una professoressa, 1967
- testo: "Non c'è nulla che sia più ingiusto quanto far parti uguali fra disuguali."
  autore: "Scuola di Barbiana"
  en: "Nothing is more unjust than treating unequals equally."

# Seneca, Lettere a Lucilio, VI, 5
# «Longum iter est per praecepta, breve et efficax per exempla»
- testo: "Lunga è la strada degli insegnamenti, breve ed efficace quella degli esempi."
  autore: "Seneca"
  en: "The way is long through precepts, but short and effective through examples."

# Gianni Rodari, Il libro degli errori, 1964
- testo: "Gli errori sono necessari, utili come il pane e spesso anche belli."
  autore: "Gianni Rodari"
  en: "Mistakes are necessary, as useful as bread, and often beautiful too."

# Hannah Arendt, La crisi dell'istruzione, 1958
# Estratto dal passaggio conclusivo
- testo: "L'educazione è il momento in cui decidiamo se amiamo abbastanza il mondo da assumerci la responsabilità."
  autore: "Hannah Arendt"
  en: "Education is the point at which we decide whether we love the world enough to assume responsibility for it..."

  # Galileo Galilei, Il Saggiatore, 1623
# Estratto dal celebre passo sul libro della natura
- testo: "La filosofia è scritta in questo grandissimo libro che continuamente ci sta aperto innanzi a gli occhi (io dico l'universo)."
  autore: "Galileo Galilei"
  en: "Philosophy is written in this grand book that continually lies open before our eyes (I mean the universe)."

# Gaston Bachelard, La formazione dello spirito scientifico, 1938
# «Rien ne va de soi. Rien n'est donné. Tout est construit.»
- testo: "Nulla va da sé. Nulla è dato. Tutto è costruito."
  autore: "Gaston Bachelard"
  en: "Nothing is self-evident. Nothing is given. Everything is constructed."

# Richard Feynman, Cargo Cult Science, 1974
- testo: "Il primo principio è che non devi ingannare te stesso, e tu sei la persona più facile da ingannare."
  autore: "Richard Feynman"
  en: "The first principle is that you must not fool yourself—and you are the easiest person to fool."

# Carl Sagan, Il mondo infestato dai demoni, 1995
- testo: "La scienza è un modo di pensare molto più che un insieme di conoscenze."
  autore: "Carl Sagan"
  en: "Science is a way of thinking much more than it is a body of knowledge."

# Bertrand Russell, The Triumph of Stupidity, 1933
- testo: "La causa fondamentale del problema è che, nel mondo moderno, gli stupidi sono sicurissimi di sé mentre gli intelligenti sono pieni di dubbi."
  autore: "Bertrand Russell"
  en: "The fundamental cause of the trouble is that in the modern world the stupid are cocksure while the intelligent are full of doubt."

# Karl Popper, Congetture e confutazioni, 1963
- testo: "La nostra conoscenza può essere soltanto finita, mentre la nostra ignoranza deve necessariamente essere infinita."
  autore: "Karl Popper"
  en: "Our knowledge can only be finite, while our ignorance must necessarily be infinite."

# Karl Popper, La società aperta e i suoi nemici, 1945
- testo: "Io posso avere torto e tu puoi avere ragione, e con uno sforzo potremmo avvicinarci alla verità."
  autore: "Karl Popper"
  en: "I may be wrong and you may be right, and by an effort, we may get nearer to the truth."

  # William Bruce Cameron, Informal Sociology, 1963
- testo: "Non tutto ciò che può essere contato conta, e non tutto ciò che conta può essere contato."
  autore: "William Bruce Cameron"
  en: "Not everything that can be counted counts, and not everything that counts can be counted."

# Seneca, Lettere a Lucilio, CVI, 12
# «Non vitae, sed scholae discimus»
# Nel testo originale è una critica alla cultura fine a sé stessa
- testo: "Non impariamo per la vita, ma per la scuola."
  autore: "Seneca"
  en: "We learn not for life, but for school."

# Isaac Newton, lettera a Robert Hooke, 5 febbraio 1676
- testo: "Se ho visto più lontano, è perché stavo sulle spalle dei giganti."
  autore: "Isaac Newton"
  en: "If I have seen further it is by standing on the shoulders of giants."